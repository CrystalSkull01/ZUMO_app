spring.application.name=dehiwala-zoo-api
server.port=8080
spring.datasource.url=jdbc:postgresql://localhost:5432/dehiwala_zoo
spring.datasource.username=dehiwala_app
spring.datasource.password=
spring.datasource.hikari.initialization-fail-timeout=-1
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.sql.init.mode=never
spring.jackson.serialization.write-dates-as-timestamps=false

app.legacy-import.enabled=false
app.legacy-import.data-dir=../assets/data
app.cors.allowed-origins=http://localhost:5500,http://127.0.0.1:5500